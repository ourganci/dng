<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol class="breadcrumb__list" itemscope itemtype="https://schema.org/BreadcrumbList">
    @for (item of items; track item.label; let i = $index; let last = $last) {
    <li
      class="breadcrumb__item"
      itemprop="itemListElement"
      itemscope
      itemtype="https://schema.org/ListItem"
    >
      @if (!last && item.url) {
        <a [routerLink]="item.url" class="breadcrumb__link" itemprop="item">
          <span itemprop="name">{{ item.label }}</span>
        </a>
        <span class="breadcrumb__separator" aria-hidden="true">&#8250;</span>
      }
      @if (last) {
        <span class="breadcrumb__current" aria-current="page" itemprop="name">{{ item.label }}</span>
      }
      <meta itemprop="position" [attr.content]="i + 1" />
    </li>
    }
  </ol>
</nav>
